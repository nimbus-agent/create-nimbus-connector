# fixtures/snapshots/ holds complete generated connector packages, checked in as byte-exact
# golden data — including each one's own test/sandbox.test.ts. Those are snapshot DATA, not
# this project's own tests: they import "@nimbus-dev/sdk/testing", which is not a dependency
# of this repo (it only resolves once a real SDK is installed into that generated package,
# e.g. by standalone-acceptance in a temp dir). Without this, Bun's default recursive `bun
# test` discovery sweeps those files in and fails them with "Cannot find module". Excluding
# only fixtures/** (rather than restricting discovery to test/ repo-wide) is deliberate: a
# `root` restriction would also silently skip any future test file placed outside test/ —
# no error, just never run — which is exactly the "passes without asserting anything" failure
# mode this project has been guarding against elsewhere. If you add a test somewhere new and
# it isn't running, this is why.
[test]
pathIgnorePatterns = ["fixtures/**"]

# Coverage counts the code under test, not the tests. Without this, every test file scores
# ~100% (a test file is, by construction, fully executed by running it) and drags the
# headline number up: the aggregate read 97.66% while src/cli.ts sat at 42.76%. A number
# that cannot go down is not a gate.
coverageSkipTestFiles = true

# Bun enforces this PER FILE, not against the aggregate — verified: 0.30 passes, 0.95 fails,
# and src/cli.ts is one of the files that fails 0.95. That is the stronger reading (an average
# lets one well-covered file hide an uncovered one), so the floor is set by the weakest file
# rather than by the mean, which — before any exclusion — currently reads 97.26% lines /
# 98.13% functions.
#
# That PRE-exclusion floor is src/prompts.ts at 35.42% lines / 42.86% functions, with
# src/cli.ts close behind at 51.85% lines / 65.00% functions, and NEITHER is a testing gap.
# test/cli-main.test.ts drives the CLI through Bun.spawnSync on the real binary — a full suite
# asserting the bytes it puts on disk — and Bun does not instrument child processes, so every
# line main() executes reads as uncovered. Spawning the real binary is the better test: it
# proves the shipped entry point works, which an in-process call does not. src/prompts.ts is
# interactive readline code, exercised the same way.
#
# So do NOT "raise coverage" on those two by adding in-process tests that duplicate the
# subprocess ones. That would move the number without adding assurance, which is the
# false-green pattern this repo has spent several rounds removing. Raise the floor only when
# a real gap closes.
# Excluded from the coverage METRIC, not from testing — and this is the one exclusion in
# this file, so it has to earn itself. Both are driven through Bun.spawnSync on the real
# binary, which Bun cannot instrument, so leaving them in drags the per-file floor down to
# src/prompts.ts's 35.42% lines and makes the threshold vacuous for every other file. If a
# future change tests either of these in-process, delete its entry rather than raising the
# floor around it.
coveragePathIgnorePatterns = ["src/cli.ts", "src/prompts.ts"]

# A DIFFERENT floor than the pre-exclusion one above, not a second measurement of the same
# thing: that one is the raw per-file minimum across every file; this is what the minimum
# becomes once src/cli.ts and src/prompts.ts — both already accounted for above, both
# subprocess-tested by design — are removed from consideration. With those two excluded, the
# floor is src/derive/manifest.ts at 89.29% lines, and src/emit/server/tools-hand.ts at 90.00%
# functions. Aggregate is 98.99% lines / 99.56% functions.
#
# manifest.ts is a small file, and a per-file floor over a small file leaves single-line
# margins by construction: one more uncovered line there is worth a bigger percentage swing
# than the same line would be in a 500-line file, so manifest.ts has zero slack today — the
# next line added to it without a matching test fails THIS file's own gate, which is enough
# to fail the whole run, per-file enforcement being the point of this threshold at all.
#
# This was 0.78 / 0.81, set by src/format.ts at 78.16% / 81.82%. That gap has now genuinely
# closed rather than been papered over: format.ts's failure-diagnosis logic was extracted into
# the pure, exported formatterUnavailableReasonFor(), which test/format.test.ts now unit-tests
# in-process across all six diagnosis branches. The pre-existing subprocess tests that drive
# the same paths through mock.module were KEPT — they prove initFormatter actually routes a
# failed import into that diagnosis, which a unit test of the pure function cannot. So both
# layers earn their place, and format.ts rose to 90.91% functions / 90.70% lines on real
# assurance, not on a duplicated in-process copy of a subprocess test. That is the distinction
# the note above draws, and the floor moves only because of it.
coverageThreshold = { lines = 0.88, functions = 0.90 }
