# fixtures/snapshots/ holds complete generated connector packages, checked in as byte-exact
# golden data — including each one's own test/sandbox.test.ts. Those are snapshot DATA, not
# this project's own tests: they import "@nimbus-dev/sdk/testing", which is not a dependency
# of this repo (it only resolves once a real SDK is installed into that generated package,
# e.g. by standalone-acceptance in a temp dir). Without this, Bun's default recursive `bun
# test` discovery sweeps those files in and fails them with "Cannot find module". Excluding
# only fixtures/** (rather than restricting discovery to test/ repo-wide) is deliberate: a
# `root` restriction would also silently skip any future test file placed outside test/ —
# no error, just never run — which is exactly the "passes without asserting anything" failure
# mode this project has been guarding against elsewhere. If you add a test somewhere new and
# it isn't running, this is why.
[test]
pathIgnorePatterns = ["fixtures/**"]

# Coverage counts the code under test, not the tests. Without this, every test file scores
# ~100% (a test file is, by construction, fully executed by running it) and drags the
# headline number up: the aggregate read 97.66% while src/cli.ts sat at 42.76%. A number
# that cannot go down is not a gate.
coverageSkipTestFiles = true

# Bun enforces this PER FILE, not against the aggregate — verified: 0.30 passes, 0.95 fails,
# and src/cli.ts is one of the files that fails 0.95. That is the stronger reading (an average
# lets one well-covered file hide an uncovered one), so the floor is set by the weakest file
# rather than by the mean, which — before any exclusion — reads 98.16% lines / 98.55%
# functions. Re-measured 2026-08-24 with `bun --config=<scratch>.toml test --coverage`, the
# scratch config being this one with coveragePathIgnorePatterns emptied. Use the flag rather
# than editing this file: these four numbers cannot be read any other way — the two files
# below are ABSENT from the normal report, not sitting at 0% in it — and a temporary edit
# here is a weakened gate that can be committed by accident.
#
# That PRE-exclusion floor is src/prompts.ts at 35.42% lines / 42.86% functions, with
# src/cli.ts close behind at 50.91% lines / 56.41% functions, and NEITHER is a testing gap.
# test/cli-main.test.ts drives the CLI through Bun.spawnSync on the real binary — a full suite
# asserting the bytes it puts on disk — and Bun does not instrument child processes, so every
# line main() executes reads as uncovered. Spawning the real binary is the better test: it
# proves the shipped entry point works, which an in-process call does not. src/prompts.ts is
# interactive readline code, exercised the same way.
#
# So do NOT "raise coverage" on those two by adding in-process tests that duplicate the
# subprocess ones. That would move the number without adding assurance, which is the
# false-green pattern this repo has spent several rounds removing. Raise the floor only when
# a real gap closes.
# Excluded from the coverage METRIC, not from testing — and this is the one exclusion in
# this file, so it has to earn itself. Both are driven through Bun.spawnSync on the real
# binary, which Bun cannot instrument, so leaving them in drags the per-file floor down to
# src/prompts.ts's 35.42% lines and makes the threshold vacuous for every other file. If a
# future change tests either of these in-process, delete its entry rather than raising the
# floor around it.
coveragePathIgnorePatterns = ["src/cli.ts", "src/prompts.ts"]

# A DIFFERENT floor than the pre-exclusion one above, not a second measurement of the same
# thing: that one is the raw per-file minimum across every file; this is what the minimum
# becomes once src/cli.ts and src/prompts.ts — both already accounted for above, both
# subprocess-tested by design — are removed from consideration. With those two excluded, the
# floor is src/format.ts, at 90.70% lines and 90.91% functions. It sets the LINES half alone
# (src/derive/ast.ts is next at 91.18%). On FUNCTIONS it no longer sets the half by itself:
# src/emit/server/tools-rest.ts ties it exactly, also at 90.91%, so an uncovered function
# arriving in EITHER file fails this threshold, and a reader who checks only format.ts will
# not see the other half of what is holding 0.90 up. Aggregate is 99.54% lines / 99.77%
# functions. Re-measured 2026-08-24 with `bun test --coverage`.
#
# format.ts is a small file, and a per-file floor over a small file leaves single-line margins
# by construction: one more uncovered line there is worth a bigger percentage swing than the
# same line would be in a 500-line file, so format.ts has ~0.7 points of slack on lines today —
# the next line added to it without a matching test fails THIS file's own gate, which is enough
# to fail the whole run, per-file enforcement being the point of this threshold at all.
#
# The previous revision of this comment named src/derive/manifest.ts (89.29% lines) and
# src/emit/server/tools-hand.ts (90.00% functions) as the two floor-setters. Both are at 100%
# today, and re-measuring is the only way that was ever going to be noticed — a threshold whose
# comment names the wrong file reads as a measurement when it is a memory. Re-measure before
# touching the numbers below, and move the file names with them.
#
# WHY format.ts stops here, and why the answer is not "write more tests". Its eight remaining
# uncovered lines are the optional-dependency load path and nothing else: initFormatter's catch,
# formatAll's unformatted pass-through, formatAll's before-init throw, and biomeVersion's
# "unknown" fallback. Every one of them is exercised — by a Bun.spawnSync subprocess in
# test/format.test.ts, because reaching them needs mock.module to break "@biomejs/js-api/nodejs"
# and mock.module's effect is process-global, so doing it in-process would poison the shared
# formatter every other suite uses. Bun does not instrument a child process, so those tests
# prove the behaviour without moving the number. That is the SAME trade the src/cli.ts note
# above describes, and it is why the honest floor is 0.90 rather than something higher.
#
# src/derive/ast.ts (91.18% lines) is the same shape one file down — the @babel/parser load
# path, subprocess for the same reason — so closing format.ts entirely would move the LINES
# floor to 0.91 and no further, and would not move the functions floor at all, since
# src/emit/server/tools-rest.ts is already sitting on it at the same 90.91%. Do not raise
# either number for headroom: 0.90 is what the tree supports.
#
# This was 0.88 / 0.90. Lines move because src/golden/resolve-root.ts reached 100% (a sibling
# directory that exists but carries no marker file is now tested, which is the arm that falls
# THROUGH rather than throwing) and src/derive/search-filter.ts rose from 94.91% to 97.74% (its
# triple no-type-alias blocker collapsed into one lookup; two of the three copies were
# unreachable, which is exactly how they read in this report). Neither came from an in-process
# copy of a subprocess test — that is the distinction the note above draws, and the floor moves
# only because of it.
coverageThreshold = { lines = 0.90, functions = 0.90 }
