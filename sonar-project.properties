# CI-based analysis. Automatic Analysis cannot ingest a coverage report, which is why this
# project reported 0.0% coverage on new code for every pull request until this file existed
# — not because the code was untested, but because no report was ever uploaded.
#
# The two must not both be on: SonarCloud rejects a CI analysis while Automatic Analysis is
# enabled. See README for the switch-over order.
sonar.projectKey=nimbus-agent_create-nimbus-connector
sonar.organization=nimbus-agent

sonar.sources=src,scripts
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Bun writes LCOV here via `bun test --coverage --coverage-reporter=lcov`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# fixtures/snapshots/ holds complete generated connector packages checked in as byte-exact
# golden data. They are output, not source: analysing them would grade the emitter's product
# as if a human wrote it, and any finding would be unfixable without breaking a snapshot.
sonar.exclusions=fixtures/**

# S1135 ("complete the task associated to this TODO comment") in these three files, and nowhere
# else. `TODO:` is a PRODUCT of this generator, not a note left in it: --from-openapi writes a
# `TODO:` marker into every spec field a document cannot state (PLACEHOLDER in src/openapi/spec.ts)
# and into every note recording a knowing divergence (src/openapi/operation.ts), and src/cli.ts
# prints the sentence telling the author what the markers mean. Documenting a marker requires
# naming it, so every hit here is prose ABOUT the mechanism — checked one by one, all ten of them,
# and not one is unfinished work. The alternative was to reword the docs around the token, which
# would degrade the documentation of a shipped feature to satisfy a linter.
#
# Scoped to the three files rather than to the rule, so a genuine `TODO:` left anywhere else —
# including in src/emit/, whose emitted skeleton also carries one — is still reported. The
# emitted ones are already invisible to this rule: they live inside template literals, which
# S1135 does not read, which is why src/emit/wiring.ts needs no entry.
sonar.issue.ignore.multicriteria=todoDoc1,todoDoc2,todoDoc3
sonar.issue.ignore.multicriteria.todoDoc1.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.todoDoc1.resourceKey=src/openapi/spec.ts
sonar.issue.ignore.multicriteria.todoDoc2.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.todoDoc2.resourceKey=src/openapi/operation.ts
sonar.issue.ignore.multicriteria.todoDoc3.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.todoDoc3.resourceKey=src/cli.ts
