version: 2
updates:
  # "bun", not "npm". This project's lockfile is bun.lock, and the npm ecosystem
  # does not know it exists: it edits package.json alone, so every PR it opened
  # died at `bun install --frozen-lockfile` with "lockfile had changes, but
  # lockfile is frozen" — before any dependency was even evaluated. Dependabot
  # has supported Bun since v1.1.39; this repo runs 1.3.14.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Listed BEFORE dev-dependencies: Dependabot assigns each dependency to the
      # first group it matches, and `@biomejs/biome` is a devDependency that would
      # otherwise be swallowed by the type-based group below.
      #
      # The two Biome packages MUST move together, for the same reason the
      # github-actions block below gives about codeql-action's init and analyze
      # steps. `@biomejs/wasm-nodejs` (optionalDependencies) is the ENGINE
      # src/format.ts formats with; `@biomejs/biome` (devDependencies) is the CLI
      # `bun run lint` runs here and the range every emitted standalone package
      # declares. They sat in different groups — one production-typed, one
      # development-typed — so Dependabot could never propose them in one pull
      # request, and did not: #106 bumped the engine to 2.5.8 and left the CLI at
      # 2.5.7. test/emit/static.test.ts's "matches the Biome ENGINE that produced
      # the bytes" caught it, which is exactly what that test exists for, but a
      # split bump cannot be made to pass by anything Dependabot can write.
      #
      # Grouping does not make a Biome bump mergeable unattended, and is not meant
      # to. src/emit/biome-json.ts's BIOME_VERSION and this repo's own biome.json
      # $schema both have to move by hand, and `diff:golden` has to be re-run
      # against a Nimbus checkout that CI does not have. What grouping buys is that
      # a human finishing the job has ONE coherent pull request to finish, instead
      # of two that are each broken until the other lands.
      biome:
        patterns:
          - "@biomejs/*"
      dev-dependencies:
        dependency-type: "development"

  # The one that matters most here. Every action in this repo is pinned to a
  # full-length commit SHA because the org requires it — which means none of
  # them will ever move on their own. Without this block the pins silently rot,
  # and a pinned-but-stale action is not more secure than an unpinned one.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Bump all actions in a single grouped PR. Multi-step actions such as
    # github/codeql-action (init + analyze) MUST move together — a split bump
    # leaves the steps on mismatched versions and CodeQL hard-fails with
    # "Loaded a configuration file for version X, but running version Y".
    groups:
      github-actions:
        patterns:
          - "*"
