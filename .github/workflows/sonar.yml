name: sonar

# CI-based SonarCloud analysis, which exists for one reason: Automatic Analysis cannot
# ingest a coverage report. Until this workflow ran, SonarCloud reported 0.0% coverage on
# new code for every pull request, while the suite it could not see was at 98.77% lines.
#
# REQUIRES Automatic Analysis to be OFF for this project. SonarCloud refuses a CI analysis
# while it is enabled, and turning it off before this workflow runs leaves the project with
# no analysis at all — so the order in the README matters.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # This org requires every action pinned to a full-length commit SHA.
      # Tag comments record what each SHA resolves to; re-resolve before bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar's new-code detection compares against the base branch, so a shallow
          # clone makes every line look new.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile --ignore-scripts

      # The whole point of this workflow. bunfig.toml's per-file coverageThreshold still
      # applies, so this step also fails if any observed file drops below its floor —
      # the gate does not become advisory just because a reporter was added.
      - name: Tests with LCOV coverage
        run: bun test --coverage --coverage-reporter=lcov

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
