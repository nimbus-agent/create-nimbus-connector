name: sonar

# CI-based SonarCloud analysis, which exists for one reason: Automatic Analysis cannot
# ingest a coverage report. Until this workflow ran, SonarCloud reported 0.0% coverage on
# new code for every pull request, while the suite it could not see was at 98.77% lines.
#
# REQUIRES two things that live outside this repository, both before the merge: a
# SONAR_TOKEN secret, and Automatic Analysis switched OFF for this project. Without the
# token the scanner cannot authenticate at all ("Not authorized or project not found"), and
# with Automatic Analysis on SonarCloud refuses a CI analysis outright. The order is in the
# README.
#
# This step is deliberately NOT guarded with `if: env.SONAR_TOKEN != ''`. A guard would make
# the workflow green while analysing nothing, which is the precise failure this repo keeps
# removing elsewhere — and it would stay green forever if the secret were never added. A
# loud failure is the correct behaviour for a workflow whose prerequisites are unmet.
#
# The job-level `if` below is NOT that guard, and the difference is the whole point. It skips
# exactly the runs where GitHub structurally withholds the Actions secret store, so
# SONAR_TOKEN is empty no matter how correctly the repository is configured. There are two
# such runs, and BOTH are needed — the second was missing until the date below:
#
#   1. A pull request opened from a fork. The scan failed on every external contribution for a
#      reason the contributor could not fix or act on, which trains everyone to read a red
#      check as noise.
#   2. A pull request opened by Dependabot. A `pull_request` run whose triggering actor is
#      dependabot[bot] resolves `secrets.*` against the DEPENDABOT store, not the Actions
#      store, and SONAR_TOKEN lives only in the latter (an org secret, `SELECTED` visibility).
#
# Case 2 is why the condition below is two clauses rather than one. The original was written
# as "the head branch lives in this repository" on the stated reasoning that this *is* the
# condition governing secret availability — and it is not, because a Dependabot branch lives
# in this repository and still gets a different store. Re-measured 2026-08-19: every sonar run
# on a `dependabot/*` branch had failed, 5 of 5 since the first one on 2026-08-11, while every
# other run since was green. Re-derive with:
#
#   gh run list --workflow sonar.yml --limit 100 \
#     --json conclusion,headBranch --jq '.[]|select(.headBranch|startswith("dependabot"))'
#
# Skipping on those two conditions cannot hide a missing secret, because pushes to main and
# human same-repo pull requests still run unguarded: forget to add SONAR_TOKEN and main goes
# red on the very next merge. `env.SONAR_TOKEN != ''` would have suppressed that too, and that
# is why it stays rejected — test/release-workflow-guard.test.ts now enforces that rejection
# rather than leaving it as prose here.
#
# The alternative to case 2 is to put SONAR_TOKEN in the Dependabot secret store as well. It
# was considered and declined. The step below is the same job that has already run
# `bun test --coverage`, which executes the freshly bumped dependency's code in-process — zod,
# @babel/parser and @biomejs/wasm-nodejs all run during the suite, and a wasm-nodejs bump is
# among the PRs this would apply to. `--ignore-scripts` closes the postinstall vector but not
# that one, and step-scoped `env:` is defence in depth rather than a boundary, since any step
# can append to $GITHUB_PATH. The purchase is close to nil: the bound gate grades `new_*`
# metrics against the pull request's own diff, and a Dependabot diff is bun.lock, package.json
# and workflow SHAs — no analysable source, so no condition has anything to grade.
#
# Nothing is lost by skipping the whole job rather than only the upload. ci.yml already runs
# `bun test --coverage`, so bunfig.toml's per-file coverageThreshold is enforced on both kinds
# of pull request there. This job's unique contribution is the LCOV upload, and that is
# exactly the part these two cannot do. Nor does anything go permanently unanalysed: this
# workflow also runs on `push: [main]`, so merging the pull request scans the result with the
# token. Skipping defers the analysis by one merge; it does not skip it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    # Two clauses, one per case in the header. Neither is a stand-in for "is SONAR_TOKEN set".
    #
    # Compares head repo to this one rather than reading `head.repo.fork`, which survives the
    # fork-of-a-fork case.
    #
    # `github.actor`, not `github.event.pull_request.user.login`: what selects the Dependabot
    # secret store is who triggered THIS run, not who opened the pull request. A human pushing
    # a commit to a Dependabot branch — a rebase, a lockfile fixup — triggers a run with the
    # Actions store available, and that run should be scanned. Keying on the pull request's
    # author would skip it forever.
    #
    # Every line below sits at ONE indent level on purpose: `>-` folds equally-indented lines
    # into a single line with spaces, and preserves a more-indented one as a literal newline.
    # Indenting the parenthesised clause for readability puts raw newlines into the expression
    # GitHub parses.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    # 15, not 10, because the scan step now waits on the quality gate: the scanner's own
    # `sonar.qualitygate.timeout` defaults to 300s, and 10 minutes left the run able to be
    # killed by the JOB timeout mid-poll — which reports "cancelled" rather than the gate's
    # verdict and looks like flake instead of a result.
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # This org requires every action pinned to a full-length commit SHA.
      # Tag comments record what each SHA resolves to; re-resolve before bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar's new-code detection compares against the base branch, so a shallow
          # clone makes every line look new.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile --ignore-scripts

      # The whole point of this workflow. bunfig.toml's per-file coverageThreshold still
      # applies, so this step also fails if any observed file drops below its floor —
      # the gate does not become advisory just because a reporter was added.
      - name: Tests with LCOV coverage
        run: bun test --coverage --coverage-reporter=lcov

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          # Without `wait`, the scanner uploads its report and exits 0 whatever the analysis
          # then concludes — the workflow goes green, the quality gate's verdict is written
          # only to a web page, and findings accumulate unread. They reached 87 that way once
          # already. `wait` polls the compute-engine task and then the gate, and fails this
          # step when the gate does not pass, which is the difference between a report and a
          # gate.
          #
          # Turning it on with an open backlog is safe, and that is measured rather than
          # assumed. api/qualitygates/project_status names every condition the bound gate
          # ("Sonar way") evaluates, and all six are `new_*` metrics:
          # new_reliability_rating, new_security_rating and new_maintainability_rating must
          # each be A, new_coverage >= 80%, new_duplicated_lines_density <= 3%, and
          # new_security_hotspots_reviewed = 100%. Not one grades overall code, so the
          # backlog cannot fail this however large it grows. Stronger still: the findings are
          # INSIDE the new-code period, so the gate evaluates them today and still reports OK
          # — because a maintainability rating is a technical-debt ratio, not an issue count.
          # On a pull request "new code" narrows further, to that pull request's own diff.
          #
          # **The size of that backlog is deliberately not written here.** This paragraph used
          # to state it — "58 code smells", three times — and the figure was an order of
          # magnitude wrong within days, because nothing in the repository checks a sentence
          # in a comment. That is the same defect test/gate-lists.test.ts's header carries a
          # note about. The argument never depended on the number: a maintainability rating is
          # a technical-debt ratio, so the backlog cannot fail this gate however large it
          # grows. Re-measure whenever you actually want the figure, with the token this
          # workflow already needs:
          #
          #   curl -s -H "Authorization: Bearer $SONAR_TOKEN" \
          #     "https://sonarcloud.io/api/issues/search?componentKeys=nimbus-agent_create-nimbus-connector&issueStatuses=OPEN,CONFIRMED"
          #
          # The one condition that can red a run without anything in this repository being
          # wrong is new_security_hotspots_reviewed: a hotspot is cleared by a human marking
          # it reviewed in the SonarCloud UI, not by a commit. There are currently none.
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
