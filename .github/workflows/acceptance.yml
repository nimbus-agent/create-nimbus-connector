name: acceptance

# The two harnesses that actually EXECUTE generated connectors, rather than reading their
# text. Until this workflow existed they ran only when someone remembered to run them, which
# meant the strongest checks in the repo were also the least frequently exercised.
#
# Deliberately NOT part of ci.yml, for one reason: both install @nimbus-dev/sdk from the npm
# registry, so a registry outage or a slow install becomes a red X on a pull request that
# changed nothing related. Keeping them separate means a network blip fails *this* workflow
# and leaves the merge gate honest. That is also why neither is listed as a required check.
#
# `diff:golden` and `wiring:conformance` still cannot run here: both need a checkout of the
# Nimbus monorepo, a separate AGPL-3.0-only repository that this MIT repository refused to
# vendor and that this runner does not have. They remain local pre-merge gates — see ci.yml.

on:
  pull_request:
    branches: [main]
    # Only the paths that can change what a generated connector does at runtime. A README
    # or workflow-only change does not need five npm installs to prove anything.
    paths:
      - "src/**"
      - "scripts/**"
      - "fixtures/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/acceptance.yml"
  # The published SDK can change under us without anything in this repo changing, and the
  # --registry mode exists precisely to catch that. A daily run finds it without waiting for
  # someone to open an unrelated pull request.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    # Generous next to ci.yml's 10: this installs the SDK once per fixture and spawns a
    # server for each, and the expiry scenario deliberately waits for a token to lapse.
    timeout-minutes: 25
    steps:
      # audit rather than block, for the same reason ci.yml gives: this job reaches the npm
      # registry by design, and an allowlist that drifts would fail builds for reasons
      # unrelated to the change under test.
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # This org requires every action pinned to a full-length commit SHA.
      # Tag comments record what each SHA resolves to; re-resolve before bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile --ignore-scripts

      # Generates each standalone fixture, installs the PUBLISHED SDK, then typechecks,
      # lints, builds and drives it over stdio. Answers "does the artifact actually on the
      # registry satisfy the contract?", which a local SDK checkout cannot.
      - name: Standalone acceptance (published SDK)
        run: bun run standalone-acceptance --registry

      # Executes generated connectors against a loopback HTTP server and asserts on the
      # requests they actually make — auth headers, JSON body types, percent-encoding, the
      # path-arg exclusion, non-2xx handling, and the client-credentials exchange and its
      # expiry. The only check in this repo that observes runtime behaviour rather than
      # inferring it from emitted text.
      - name: Runtime acceptance (published SDK)
        run: bun run runtime:acceptance --registry
