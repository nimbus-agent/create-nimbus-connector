name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Nothing in this workflow writes to the repository;
# release.yml is the only workflow that needs more, and it declares its own.
permissions:
  contents: read

# A rapid series of pushes to the same ref should leave one running check, not a
# queue of superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned rather than ubuntu-latest: `latest` moves under you, so a green run
    # today and a red one tomorrow can differ by nothing this repo controls.
    # release.yml pins the same image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # audit rather than block: this job reaches GitHub, the Bun install
      # endpoints and the npm registry (bunx resolves tsc and biome), and an
      # allowlist that drifts fails the build for reasons unrelated to the change
      # under test. release.yml makes the same trade for the same reason.
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # This org requires every action pinned to a full-length commit SHA.
      # Tag comments record what each SHA resolves to; re-resolve before bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile --ignore-scripts

      # --coverage is not decoration: bunfig.toml sets a per-file coverageThreshold, so this
      # fails the build when any observed file drops below the floor. Without the flag the
      # thresholds are never evaluated and the gate is silently absent.
      - name: Tests and coverage
        run: bun test --coverage

      - name: Typecheck
        run: bun run typecheck

      - name: Lint and format
        run: bun run lint

# Deliberately NOT run here: `bun run diff:golden`, `bun run wiring:conformance`
# and `bun run acceptance`.
#
# All three need a checkout of the Nimbus monorepo, a separate AGPL-3.0-only
# repository that is not on this runner. Vendoring it into this MIT repo was
# rejected in decision D4 of the design doc, so they remain local pre-merge
# gates rather than CI checks.
#
# That is a real limitation, not an oversight: the project's most valuable
# check does not run here. Run these before merging:
#
#   bun run diff:golden --nimbus-root /path/to/Nimbus
#   bun run wiring:conformance --nimbus-root /path/to/Nimbus
#   bun run acceptance  /path/to/Nimbus
#
# The two harnesses that need only the published SDK — standalone-acceptance and
# runtime:acceptance — DO run automatically, in acceptance.yml. They live in
# their own workflow because both reach the npm registry, and an outage there
# should not red-X a pull request that changed nothing related.
