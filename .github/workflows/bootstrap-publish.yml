# TEMPORARY — delete this file once step 3 below is done.
#
# WHY THIS EXISTS
# ---------------
# release.yml publishes token-lessly via npm trusted publishing (GitHub OIDC).
# That binding cannot be created for a package that does not exist yet: npm has
# no pending-publisher flow ("The package you're configuring must already exist
# on the npm registry" — docs.npmjs.com/cli/v11/commands/npm-trust/), which npm
# confirmed is a deliberate MVP limitation in npm/cli#8544.
#
# So exactly one publish has to happen outside release.yml, to claim the name.
# This workflow is that one publish, and nothing else.
#
# It still produces provenance. Provenance requires a cloud-hosted runner plus
# `id-token: write` plus `--provenance` — it does NOT require OIDC *auth*. A
# `npm publish` run from a laptop with a token would get no attestation; this
# one does.
#
# THE THREE STEPS
# ---------------
#   1. Create an npm **granular** access token with write scope on
#      `create-nimbus-connector`, and add it as the repo secret
#      `NPM_BOOTSTRAP_TOKEN`. (Classic tokens no longer exist; granular write
#      tokens default to 7 days, 90 max.)
#   2. Run this workflow: Actions → "Bootstrap first npm publish" → Run workflow.
#   3. Then, and this is the part that must not be skipped:
#        a. npmjs.com → create-nimbus-connector → Settings → Trusted publishing.
#           Organization `nimbus-agent`, Repository `create-nimbus-connector`,
#           Workflow file `release.yml` (filename only, case-sensitive),
#           Environment empty.
#        b. Delete the `NPM_BOOTSTRAP_TOKEN` secret and revoke the token on npm.
#        c. Settings → Publishing access → "Require two-factor authentication
#           and disallow tokens". OIDC keeps working; tokens stop.
#        d. Delete this file.
#
# This workflow refuses to run once the package exists (see the first step), so
# it cannot quietly become the way releases happen. release.yml is that way.

name: Bootstrap first npm publish (TEMPORARY)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish — must match package.json exactly"
        required: true
        type: string
      confirm:
        description: 'Type PUBLISH to confirm this irreversible action'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bootstrap-publish
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Required for provenance. Without it npm publishes an UNATTESTED tarball
      # that cannot be unpublished after 72h, which is why the preflight below
      # treats a missing OIDC token as a hard failure rather than a warning.
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Setup Node (for npm publish --provenance)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm install -g npm@12.0.2 --ignore-scripts

      # Four independent ways this run could be a mistake, all checked before
      # anything is built. Ordered cheapest-first.
      - name: Guard — this workflow may run exactly once, for the version on disk
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
          BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$INPUT_CONFIRM" != "PUBLISH" ]; then
            echo "::error::confirm must be exactly PUBLISH (got: '$INPUT_CONFIRM')."
            exit 1
          fi

          if [ -z "${BOOTSTRAP_TOKEN:-}" ]; then
            echo "::error::NPM_BOOTSTRAP_TOKEN is not set. Create a granular npm token with"
            echo "::error::write scope on create-nimbus-connector and add it as a repo secret."
            exit 1
          fi

          declared="$(node -p "require('./package.json').version")"
          if [ "$INPUT_VERSION" != "$declared" ]; then
            echo "::error::version input '$INPUT_VERSION' does not match package.json '$declared'."
            echo "::error::npm publishes what is on disk, not what you typed — refusing to guess."
            exit 1
          fi

          # THE single-use guard. Once the name exists, trusted publishing can be
          # bound, so this token path must never be the way a release ships.
          if npm view "create-nimbus-connector@$declared" version >/dev/null 2>&1; then
            echo "::error::create-nimbus-connector@$declared is already published."
            echo "::error::Bind the trusted publisher and use release.yml. Delete this workflow."
            exit 1
          fi
          if npm view create-nimbus-connector version >/dev/null 2>&1; then
            echo "::error::create-nimbus-connector already exists on npm — the name is claimed."
            echo "::error::This bootstrap is single-use. Bind the trusted publisher, then use"
            echo "::error::release.yml for every subsequent version. Delete this workflow."
            exit 1
          fi

          echo "guard ok: publishing $declared, name is unclaimed, confirmation given"

      - name: Typecheck
        run: bun run typecheck

      - name: Lint and format
        run: bun run lint

      - name: Test
        run: bun test
        env:
          CI: "true"

      - name: Preflight — OIDC token present (provenance depends on it)
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_TOKEN is unset — the job lacks 'id-token: write'."
            echo "::error::Publishing now would succeed WITHOUT provenance and cannot be undone after 72h."
            exit 1
          fi
          echo "preflight ok: OIDC token present, npm $(npm --version)"

      # Identical in purpose to release.yml's gate: `bin` points at a TypeScript
      # file and `files` must ship it. A tarball can pack and install cleanly and
      # still be unrunnable, and no unit test can see that — they all run against
      # the working tree, where src/ obviously exists.
      - name: Verify the packed tarball actually runs
        run: |
          set -euo pipefail
          repo="$PWD"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          npm pack --pack-destination "$work" >/dev/null
          count="$(find "$work" -maxdepth 1 -name '*.tgz' | wc -l)"
          if [ "$count" != 1 ]; then
            echo "::error::expected exactly one packed tarball, found $count"
            exit 1
          fi
          tarball="$(find "$work" -maxdepth 1 -name '*.tgz')"
          echo "packed: $(basename "$tarball") ($(wc -c <"$tarball") bytes)"

          consumer="$work/consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts "$tarball"

          out="$consumer/generated"
          ./node_modules/.bin/create-nimbus-connector \
            --spec "$repo/fixtures/zzstandalone.spec.json" \
            --standalone \
            --out-dir "$out"

          missing=0
          for f in src/server.ts test/sandbox.test.ts package.json \
                   nimbus.extension.json tsconfig.json README.md biome.json; do
            if [ ! -s "$out/$f" ]; then
              echo "::error::generated output is missing or empty: $f"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "pack-and-execute ok: installed tarball generated 7 files via Bun"

      # The one and only token-authenticated publish. release.yml has no
      # NODE_AUTH_TOKEN anywhere and must never gain one — a silent token
      # fallback would let releases keep shipping if the OIDC binding broke,
      # which is exactly the guarantee that binding exists to provide.
      # release-workflow-guard.test.ts asserts release.yml stays token-free.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

      - name: Verify the published tarball's registry signature
        env:
          PUBLISHED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          printf '{"name":"provenance-verify","version":"0.0.0","private":true,"dependencies":{"create-nimbus-connector":"%s"}}\n' \
            "${PUBLISHED_VERSION}" > package.json
          # Packument and attestation lags are independent, so resolution,
          # install and audit retry TOGETHER — see release.yml for the incidents
          # that shaped this.
          verified=""
          for attempt in 1 2 3 4 5 6 7 8; do
            if npm install --package-lock-only --prefer-online \
                 --no-audit --no-fund --ignore-scripts \
              && npm ci --no-audit --no-fund --ignore-scripts \
              && npm audit signatures; then
              verified=1
              break
            fi
            if [ "$attempt" != 8 ]; then
              sleep $(( attempt * 10 ))
            fi
          done
          if [ -z "$verified" ]; then
            echo "::error::create-nimbus-connector@${PUBLISHED_VERSION} could not be signature-verified after 8 attempts."
            exit 1
          fi

      - name: What to do now
        env:
          PUBLISHED_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "### Bootstrap publish complete — \`create-nimbus-connector@${PUBLISHED_VERSION}\`"
            echo ""
            echo "The name is claimed and the tarball carries verified provenance."
            echo "**This workflow will now refuse to run again.** Finish the handover:"
            echo ""
            echo "1. npmjs.com → create-nimbus-connector → Settings → **Trusted publishing**"
            echo "   - Organization: \`nimbus-agent\`"
            echo "   - Repository: \`create-nimbus-connector\`"
            echo "   - Workflow file: \`release.yml\` (filename only, case-sensitive)"
            echo "   - Environment: *(leave empty)*"
            echo "2. Delete the \`NPM_BOOTSTRAP_TOKEN\` repo secret and revoke the token on npm."
            echo "3. Settings → Publishing access → **Require 2FA and disallow tokens**."
            echo "4. Delete \`.github/workflows/bootstrap-publish.yml\`."
            echo ""
            echo "Then merge the open release-please PR — that release publishes token-lessly."
          } >> "$GITHUB_STEP_SUMMARY"
