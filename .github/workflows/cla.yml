name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

# Nothing is granted workflow-wide; the job below declares what it needs.
#
# nimbus-sdk declares this set once at workflow level. On a `pull_request_target` workflow,
# which runs with the base repository's token and secrets, that over-grant is worth closing
# rather than copying.
permissions: {}

# Accounts exempt from signing, passed to contributor-assistant as its `allowlist` input.
#
# Matching is NOT exact and NOT anchored. checkAllowList.ts at the pinned SHA below escapes
# each entry, replaces `*` with `.*`, and calls `new RegExp(pattern).test(name)` — an
# unanchored test — against `committer.login || committer.name` (graphql.ts). So `bot*`
# becomes /bot.*/ and exempts any committer whose name merely CONTAINS "bot", `robot`
# included. That over-exemption is real and is accepted here rather than fixed blind:
#
# PR #39 removed the `bot*` entry, reasoning that GitHub App logins are suffixed
# (`nimbus-release-bot[bot]`) so a prefix glob could never match. Release PR #35 had passed
# with `bot*` present and release PR #41 failed without it, nothing else changed — so some
# release-bot commit is reaching this filter under a name that `*[bot]` and the two literal
# entries do not cover, and only the containment match caught it. Both forms stay until
# someone reads that name off a real release PR; removing `bot*` on the reasoning above has
# already been tried once and it broke the release.
env:
  CLA_ALLOWLIST: 'bot*,*[bot],nimbus-release-bot[bot],dependabot[bot],asafgolombek,claude'

# Keyed by head SHA for push events, so two commits pushed in quick succession do not
# contend: previously both shared one group, and on PR #38 the newer commit's run was
# dropped, leaving the required `cla-assistant` check missing for the head that mattered.
# Signing comments carry no head SHA and share a single per-PR group, which is what we want —
# concurrent signature writes to the same file should serialize, not race.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.pull_request.head.sha || 'comment' }}
  cancel-in-progress: false

jobs:
  # `cla-assistant` — this job's NAME — is the required status check on main, because the
  # job's own conclusion is the only verdict this action ever publishes. contributor-assistant
  # posts no commit status and creates no check run of its own: setupClaCheck.ts at the pinned
  # SHA below ends in either `core.info("All contributors have signed the CLA")` or
  # `core.setFailed("Committers of Pull Request number N have to sign the CLA")`, and nothing
  # else. The job passes or fails; that is the whole signal.
  #
  # A context named `cla` was required here instead until this change, on the belief that the
  # action posted a status under that name. Nothing ever did. A companion job supplied `cla`
  # for allowlisted authors ONLY — the maintainer, release-please, Dependabot — so every pull
  # request that could merge did, and the one population the check exists for could not: PR
  # #94's head carried no `cla` status of any kind, every visible check green, un-mergeable
  # with a required context that no workflow in this repository could produce. The gap was
  # invisible precisely because it was patched for the authors who did not need it.
  #
  # Allowlisted authors need no separate job. checkAllowList() drops them from the committer
  # list before the signature lookup, leaving `notSigned` empty, so this job reports success
  # for the release bot the same way it does for a contributor who has signed.
  #
  # Renaming this job renames the required context, and a required context nothing produces
  # blocks every pull request. test/release-workflow-guard.test.ts pins the name for that
  # reason — it is the one line here that branch protection reads by hand.
  cla-assistant:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Exactly the set nimbus-sdk grants workflow-wide, unchanged — this is the
    # job that actually needed it. Narrowing it further is a separate question
    # to settle against contributor-assistant's behaviour, not something to
    # guess at while moving the block.
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: write
      statuses: write
    # Only run on the sign/recheck comment or on a PR event — never on other comments.
    #
    # A skipped job reports `skipped`, which branch protection counts as satisfied. That is
    # harmless only because the `pull_request_target` arm of this condition is unconditional:
    # every pull request gets a real run of this job against its head. The `issue_comment`
    # arm's runs attach to the default branch, not to any PR head, so they cannot satisfy
    # anything. Do not add a condition that can skip this job on a `pull_request_target`
    # event — that would turn the required check into a green no-op.
    if: >-
      (github.event.issue.pull_request && contains(fromJSON('["I have read the CLA Document and I hereby sign the CLA","recheck"]'), github.event.comment.body))
      || github.event_name == 'pull_request_target'
    steps:
      # The one workflow that lacked this, and the one where it is worth most: it runs on
      # `pull_request_target` — the base repository's token and secrets, on a trigger any
      # external contributor fires by opening a pull request — and it hands a minted App
      # token to a third-party action. audit, not block, because contributor-assistant
      # resolves GitHub's API and the runner's own endpoints and an allowlist that drifts
      # would fail an outside contributor's pull request for a reason they cannot act on.
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # Narrowed to exactly what the token's only consumer uses. Read from
      # contributor-assistant/github-action at the SHA pinned below rather than guessed:
      # `getPATOctokit()` — the client built from PERSONAL_ACCESS_TOKEN — is imported by
      # exactly one module, src/persistence/persistence.ts, and backs exactly two calls,
      # `repos.getContent` and `repos.createOrUpdateFileContents`, both against the
      # signatures file. Everything else the action does (the PR comment, the workflow
      # re-run) goes through `getDefaultOctokitClient()`, i.e. GITHUB_TOKEN, governed by
      # this job's `permissions:` block above.
      #
      # So: `contents: write`, and nothing else. Without `permission-*` inputs this token
      # carried the App INSTALLATION's entire permission set instead.
      #
      # `repositories` narrows for the same reason. persistence.ts always addresses
      # `input.getRemoteRepoName()`, which `remote-repository-name` below pins to `.github`,
      # so this repository was never reachable through this token by its only consumer —
      # it was reachable only by anything else the third-party action might do with it.
      - name: Mint CLA App token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CLA_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: .github
          permission-contents: write
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.apptoken.outputs.token }}
        with:
          path-to-document: 'https://github.com/nimbus-agent/.github/blob/main/CLA/ICLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          remote-repository-name: '.github'
          branch: 'cla-signatures'
          allowlist: ${{ env.CLA_ALLOWLIST }}
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Thanks for your PR. Before it can be merged, please sign the [Individual CLA](https://github.com/nimbus-agent/.github/blob/main/CLA/ICLA.md) by commenting exactly: **I have read the CLA Document and I hereby sign the CLA**. Contributing on behalf of an employer? See the [Corporate CLA](https://github.com/nimbus-agent/.github/blob/main/CLA/CCLA.md).'
